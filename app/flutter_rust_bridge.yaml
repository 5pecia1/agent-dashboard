# flutter_rust_bridge_codegen 설정. `mise run frb:codegen`과
# `mise run frb:codegen:check`가 인자 없이 `flutter_rust_bridge_codegen generate`
# 를 부르며, CLI가 실행 디렉터리에서 이 파일을 찾는다 — 두 태스크 모두
# 프로젝트 루트에서 돌므로 아래 경로는 전부 루트 기준 상대 경로다.
#
# 여기 적힌 경로는 다른 파일들과 짝이 맞아야 한다:
#   - dart_output       flutter_app/analysis_options.yaml의 `lib/src/rust/**`
#                       제외, scripts/file_size_budget.sh의 DART_EXCLUDE_PREFIX,
#                       .mise.toml frb:codegen:check의 git diff 경로
#   - rust_output       scripts/file_size_budget.sh의 RUST_EXCLUDE_EXACT,
#                       app-frb/src/lib.rs의 `mod frb_generated;` 선언
# 한쪽만 바꾸면 게이트가 생성물을 손코딩 파일로 오인한다.

# 브리지에 노출할 Rust 표면. app-frb/src/api/ 아래 모듈만 읽는다 — 도메인
# 로직(app-core)은 직접 노출하지 않고 이 api 모듈이 감싸서 내보낸다.
# Canonicalize the shared root before resolving input/output paths on Windows.
base_dir: .
rust_input: crate::api

# 위 crate::api가 속한 crate의 루트.
rust_root: app-frb/

# codegen이 만들어 덮어쓰는 Rust 디스패치 테이블. 손으로 고치지 않는다.
rust_output: app-frb/src/frb_generated.rs

# codegen이 만드는 Dart 바인딩 디렉터리. api 모듈 하나당 .dart 파일 하나가
# 생기고(예: api/capability.rs → lib/src/rust/api/capability.dart), 진입점
# RustLib이 lib/src/rust/frb_generated.dart에 놓인다(flutter_app/lib/main.dart
# 가 그걸 import해 RustLib.init()을 부른다).
dart_output: flutter_app/lib/src/rust

# 생성 Dart 코드에도 프로젝트 포맷터를 적용해, 커밋된 산출물이 사람이 연
# diff에서 튀지 않게 한다.
dart_format_line_length: 80

# The module and its lint boundary are already wired in the seed.
add_mod_to_lib: false
