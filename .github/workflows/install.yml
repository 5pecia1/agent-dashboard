name: Release installer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the public installer
        run: |
          bash -n install.sh
          python3 -m unittest discover -s scripts/tests -p test_install_release.py -v
