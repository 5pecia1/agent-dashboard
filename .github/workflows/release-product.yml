name: Release Agent Dashboard
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing app tag for a release retry
        type: string
        required: false
      sign_only:
        description: Sign and verify this branch commit without publishing
        type: boolean
        default: false
      expected_sha:
        description: Exact reviewed branch commit for a signing rehearsal
        type: string
        required: false
      allow_rollback:
        description: Allow an older stable version to replace production
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: product-release-${{ inputs.sign_only && github.sha || inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == '5pecia1/agent-dashboard' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      pages_branch: ${{ steps.source.outputs.pages_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check the tag, source branch, and app version
        id: source
        env:
          SIGN_ONLY: ${{ inputs.sign_only }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "$SIGN_ONLY" = true ]; then
            test "$GITHUB_REF_TYPE" = branch
            test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
            export RELEASE_TAG="v$(python3 app/scripts/version_check.py)"
          else
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
          fi
          python3 app/scripts/version_check.py --tag "$RELEASE_TAG"
          python3 - <<'PY'
          import os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Use an app version tag such as v0.1.1 or v0.2.0-alpha.1')
          prerelease = '-' in tag
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          branch = 'release-' + tag.replace('.', '-') if prerelease else 'main'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\ncommit={commit}\nprerelease={str(prerelease).lower()}\npages_branch={branch}\n')
          PY
  web:
    if: ${{ !inputs.sign_only }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config
      - uses: jdx/mise-action@v2
        with:
          working_directory: app
      - run: mise run tools:rust
      - run: mise run tools:licenses
      - run: mise run tools:web
      - run: mise run deps
      - run: mise run check
      - run: mise run verify
      - run: python3 -m unittest discover -s scripts/tests -p test_release_product.py
      - run: mise run build:web
      - name: Check the built app in Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/web-browser"
          "$RUNNER_TEMP/web-browser/bin/pip" install playwright==1.55.0
          "$RUNNER_TEMP/web-browser/bin/python" -m playwright install --with-deps chromium
          python3 scripts/serve_web.py --port 8765 > "$RUNNER_TEMP/web-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          "$RUNNER_TEMP/web-browser/bin/python" scripts/web_push_smoke.py http://127.0.0.1:8765 --output "$RUNNER_TEMP/web-smoke"
      - name: Package the verified web build
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 scripts/release_product.py package --platform web --source flutter_app/build/web --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/product-web"
      - uses: actions/upload-artifact@v4
        with:
          name: product-web
          retention-days: 1
          overwrite: true
          path: ${{ runner.temp }}/product-web/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-failure-evidence
          retention-days: 1
          path: |
            ${{ runner.temp }}/web-smoke/
            ${{ runner.temp }}/web-server.log
          if-no-files-found: ignore
  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-signing
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      BUNDLE_ID: io.github.5pecia1.mydashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Reuse an already published release on retry
        if: ${{ !inputs.sign_only }}
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags.txt"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/published-tags.txt"; then
            gh release download "$RELEASE_TAG" --pattern '*-macos-*.zip' --pattern 'release.json' --pattern 'Apple-notarization.json' --dir "$RUNNER_TEMP/product-macos"
            python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']) / 'product-macos'
          manifest = base / 'release.json'
          record = json.loads(manifest.read_text())
          mac, = [a for a in record.pop('artifacts') if a['platform'] == 'macos']
          (base / f"macos-{mac['arch']}.artifact.json").write_text(json.dumps(dict(record, artifact=mac)))
          manifest.unlink()
          PYTHON
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check signing configuration
        if: steps.published.outputs.reuse != 'true'
        env:
          CI_SIGNING_P12: ${{ secrets.CI_SIGNING_P12 }}
          CI_SIGNING_P12_PASSWORD: ${{ secrets.CI_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo '::error::Set APPLE_TEAM_ID in macos-signing.'; exit 1; }
          for name in CI_SIGNING_P12 CI_SIGNING_P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Set $name in macos-signing."
              exit 1
            fi
          done
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          working_directory: app
          install: false
      - name: Run macOS release checks
        if: ${{ !inputs.sign_only }}
        working-directory: app
        run: |
          mise install
          mise run tools:rust
          mise run tools:licenses
          mise run deps
          mise run check
          mise run verify
      - name: Build the universal macOS archive from the reviewed source
        if: steps.published.outputs.reuse != 'true'
        working-directory: app
        run: |
          mise install flutter rust
          MISE_EXEC_AUTO_INSTALL=false mise exec -- python3 scripts/macos_distribution.py archive --project flutter_app \
            --source-commit "$SOURCE_COMMIT" --bundle-id "$BUNDLE_ID" --archive "$RUNNER_TEMP/product.xcarchive"
      - name: Resume an interrupted request from this run
        if: steps.published.outputs.reuse != 'true' && github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name' > "$RUNNER_TEMP/artifacts.txt"
          recovery=$(awk -v prefix="macos-notary-recovery-$GITHUB_RUN_ID-" \
            'index($0,prefix)==1 { n=substr($0,length(prefix)+1); if(n~/^[0-9]+$/ && n+0>max) { max=n+0; name=$0 } } END { print name }' \
            "$RUNNER_TEMP/artifacts.txt")
          if [ -n "$recovery" ]; then
            state="$RUNNER_TEMP/product.xcarchive/DashboardNotarization"
            gh run download "$GITHUB_RUN_ID" --name "$recovery" --dir "$state"
            test -f "$state/build.json" && test -f "$state/upload-started"
          fi
      - name: Sign with Developer ID and notarize with Apple
        id: signing
        if: steps.published.outputs.reuse != 'true'
        env:
          CI_SIGNING_P12: ${{ secrets.CI_SIGNING_P12 }}
          CI_SIGNING_P12_PASSWORD: ${{ secrets.CI_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 app/scripts/macos_distribution.py sign-ci --wait-seconds 1800 \
            --archive "$RUNNER_TEMP/product.xcarchive" --output "$RUNNER_TEMP/Agent Dashboard.app" \
            --notary-receipt "$RUNNER_TEMP/product-macos/Apple-notarization.json" \
            --source-commit "$SOURCE_COMMIT" --bundle-id "$BUNDLE_ID" --team-id "$TEAM_ID"
      - name: Package the signed universal app
        if: steps.published.outputs.reuse != 'true'
        run: |
          python3 app/scripts/release_product.py package --platform macos --arch universal \
            --source "$RUNNER_TEMP/Agent Dashboard.app" --team-id "$TEAM_ID" --tag "$RELEASE_TAG" \
            --commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/product-macos"
      - name: Verify the extracted ZIP, signing team, notarization and source
        run: |
          python3 app/scripts/release_product.py verify-macos --input "$RUNNER_TEMP/product-macos" \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --team-id "$TEAM_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-macos
          retention-days: 1
          compression-level: 0
          overwrite: true
          path: ${{ runner.temp }}/product-macos/
          if-no-files-found: error
      - name: Save the Apple acceptance record
        if: steps.published.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-notarization
          retention-days: 1
          overwrite: true
          path: ${{ runner.temp }}/product-macos/Apple-notarization.json
          if-no-files-found: error
      - name: Locate resumable notarization state
        id: recovery
        if: failure() && (steps.signing.outcome == 'failure' || steps.signing.outcome == 'success')
        run: |
          if [ -f "$RUNNER_TEMP/product.xcarchive/DashboardNotarization/upload-started" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve the original submitted ZIP and its request
        if: failure() && steps.recovery.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-notary-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/product.xcarchive/DashboardNotarization/*.zip
            ${{ runner.temp }}/product.xcarchive/DashboardNotarization/build.json
            ${{ runner.temp }}/product.xcarchive/DashboardNotarization/upload-started
            ${{ runner.temp }}/product.xcarchive/DashboardNotarization/submission.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  publish:
    if: ${{ !inputs.sign_only }}
    needs: [source, web, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: product-*
          path: artifacts
      - name: Assemble the verified release
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          python3 app/scripts/release_product.py combine --input artifacts --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --output release
          # Immutable releases predating the CI receipt may omit it on a retry.
          if [ -f artifacts/product-macos/Apple-notarization.json ]; then
            cp artifacts/product-macos/Apple-notarization.json release/
            (cd release && sha256sum Apple-notarization.json >> SHA256SUMS)
          fi
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            mkdir existing
            gh release download "$RELEASE_TAG" --dir existing
            (cd existing && sha256sum --check SHA256SUMS)
            python3 - <<'PY'
          import json, os
          release = json.load(open('existing/release.json'))
          if release['tag'] != os.environ['RELEASE_TAG'] or release['source_commit'] != os.environ['SOURCE_COMMIT']:
              raise SystemExit('Existing release belongs to another source; never replace published assets')
          from pathlib import Path
          from hashlib import file_digest
          expected, = [a for a in json.load(open('release/release.json'))['artifacts'] if a['platform'] == 'macos']
          current, = [a for a in release['artifacts'] if a['platform'] == 'macos']
          if expected != current:
              raise SystemExit('Existing macOS release differs from the Developer ID verified artifact')
          verified_log = Path('release/Apple-notarization.json')
          if verified_log.is_file() and (Path('existing') / verified_log.name).read_bytes() != verified_log.read_bytes():
              raise SystemExit('Existing Apple notarization receipt differs from the verified release')
          with (Path('existing') / expected['file']).open('rb') as archive:
              if file_digest(archive, 'sha256').hexdigest() != expected['sha256']:
                  raise SystemExit('Existing macOS ZIP differs from the verified signed bytes')
          PY
          else
            test -s release/Apple-notarization.json
            args=()
            if [ "$PRERELEASE" = true ]; then
              args+=(--prerelease --latest=false)
            else
              args+=(--latest=true)
            fi
            cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Web and macOS builds of Agent Dashboard. See `release.json` for the source commit and artifact hashes, and `SHA256SUMS` to verify downloads.

          The macOS app is Developer ID signed and includes an Apple notarization ticket. The release receipt records its signing team and bundle identifier. `Apple-notarization.json` contains Apple’s acceptance record for the uploaded build.

          Cloudflare Pages deployment is the next job in this workflow. Stable versions update production; prereleases publish a preview.
          EOF
            gh release create "$RELEASE_TAG" --verify-tag "${args[@]}" --title "Agent Dashboard $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" release/*
          fi
  deploy:
    needs: [source, publish]
    runs-on: ubuntu-24.04
    environment: cloudflare-pages
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_PAGES_URL: ${{ vars.CLOUDFLARE_PAGES_URL }}
    steps:
      - name: Require Cloudflare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set CLOUDFLARE_API_TOKEN in the cloudflare-pages GitHub environment; see docs/deployment.md'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set CLOUDFLARE_ACCOUNT_ID in the cloudflare-pages environment'; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo '::error::Set CLOUDFLARE_PAGES_PROJECT in the cloudflare-pages environment'; exit 1; }
          python3 - <<'PY'
          import os, urllib.parse
          url = urllib.parse.urlsplit(os.environ['CLOUDFLARE_PAGES_URL'])
          if url.scheme != 'https' or not url.hostname or url.username or url.password or url.path not in ('', '/') or url.query or url.fragment:
              raise SystemExit('Set CLOUDFLARE_PAGES_URL to the actual HTTPS production origin shown by Pages; the domain may differ from the project name')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - name: Download and verify the published web archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          mkdir published
          gh release download "$RELEASE_TAG" --pattern '*-web.tar.gz' --pattern SHA256SUMS --dir published
          (cd published && sha256sum --check --ignore-missing SHA256SUMS)
          archive="published/agent-dashboard-$RELEASE_TAG-web.tar.gz"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          python3 app/scripts/release_product.py verify-web --archive "$archive" --sha256 "$digest" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/pages-web"
      - name: Verify Pages access and production version
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/pages_deployment.py check
      - name: Deploy the published artifact to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          PAGES_BRANCH: ${{ needs.source.outputs.pages_branch }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'scripts')
          from pages_deployment import normalized_token
          env = dict(os.environ, CLOUDFLARE_API_TOKEN=normalized_token(os.environ['CLOUDFLARE_API_TOKEN']))
          subprocess.run(['server/node_modules/.bin/wrangler', 'pages', 'deploy',
                          os.environ['RUNNER_TEMP'] + '/pages-web', '--project-name', os.environ['CLOUDFLARE_PAGES_PROJECT'],
                          '--branch', os.environ['PAGES_BRANCH'], '--commit-hash', os.environ['SOURCE_COMMIT'],
                          '--commit-message', 'Agent Dashboard ' + os.environ['RELEASE_TAG']], env=env, check=True)
          PY
      - name: Confirm production serves this release
        if: needs.source.outputs.prerelease == 'false'
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 scripts/pages_deployment.py confirm
