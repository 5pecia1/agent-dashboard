name: Server package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  server:
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run check
      - run: npm --prefix server test
      - run: npm --prefix server run verify:package
      - run: npm --prefix server run test:upgrade
      - run: npm --prefix server run verify:starter
      - run: python3 scripts/contract_check.py
      - name: Check Pages deployment guards
        run: python3 -m unittest discover -s scripts/tests -p test_pages_deployment.py
      - name: Check release installer
        run: |
          python3 -m unittest discover -s scripts/tests -p test_install_release.py
          python3 -m unittest discover -s scripts/tests -p test_publish_server_retry.py
