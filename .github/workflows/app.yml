name: App
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: app
      - run: mise run tools:rust
      - run: mise run tools:licenses
      - run: xcodebuild -version
      - name: Register CocoaPods CDN
        run: pod repo add-cdn trunk https://cdn.cocoapods.org/
      - run: mise run deps
      - run: mise run build
      - run: mise run check
      - run: mise run verify
