# Codex CLI 네이티브 hooks 등록 스니핏.
#
# 설치된 Codex CLI(codex --version으로 확인)가 `features.hooks`를 stable·기본 활성으로 지원하는
# 버전이면 notify(agent-turn-complete 하나뿐, argv JSON) 대신 이 파일을 쓰는 쪽이 훨씬 낫다.
# Claude Code hooks와 같은 stdin JSON 스키마(hook_event_name/session_id/cwd)를 쓰므로
# hooks/agent-event-hook.sh 하나를 그대로 공유한다.
#
# 정본: https://learn.chatgpt.com/docs/hooks
#   - 등록 형식은 2단 array-of-tables다: [[hooks.<Event>]]가 매처 그룹, 그 안의
#     [[hooks.<Event>.hooks]]가 실제 핸들러(들)다.
#   - command는 배열이 아니라 "문자열"이고 셸을 통해 실행된다($()/$HOME 같은 셸 문법이 그대로 먹는다).
#   - matcher는 이벤트별로 뜻이 다르고(PreToolUse/PostToolUse/PermissionRequest는 도구 이름,
#     SessionStart는 source, SessionEnd는 reason), UserPromptSubmit·Stop·Interrupt에는 아예
#     적용되지 않는다. 여기서는 전부 생략해서 "이 이벤트가 뭐가 됐든" 매번 부르게 한다.
#
# 사용법:
#   1. 아래 블록을 통째로 ~/.codex/config.toml (또는 <repo>/.codex/config.toml)에 붙여넣는다.
#   2. command의 경로를 이 repo가 실제로 clone된 절대 경로로 맞춘다.
#   3. Codex TUI에서 `/hooks`를 실행해 새 hook을 신뢰(trust) 처리한다 - managed hook이 아니면
#      trust하기 전까지는 등록만 되고 실행되지 않는다. (1회성 확인이라면
#      `--dangerously-bypass-hook-trust`로 우회할 수도 있다.)
#   4. `codex features list`로 hooks가 stable/true인지 다시 확인한다.
#
# install.sh는 이 파일 내용을 config.toml에 병합해 줄 수 있지만, install.sh 자체는
# (다른 리포/전역 설정에 손대는 일이라) 사용자의 명시적 실행 전에는 이 워크플로에서 실행하지 않는다.
# 아래 스니핏을 직접 붙여넣는 쪽이 지금 당장은 더 안전하다.

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = '"$HOME/.local/share/my-dashboard/hooks/agent-event-hook.sh" codex'

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '"$HOME/.local/share/my-dashboard/hooks/agent-event-hook.sh" codex'

[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = '"$HOME/.local/share/my-dashboard/hooks/agent-event-hook.sh" codex'

# F: request_user_input(Plan 모드 질문 등)의 PreToolUse만 잡아 agent-event-hook.sh가
# UserInputRequest 합성 이벤트로 바꿔 보내게 한다(waiting_input 진입, 스로틀 없음).
# matcher의 정확한 문법(정규식인지 정확일치인지, OR가 되는지)이 공식 문서에 없어서
# 한 매처에 두 이름을 몰아넣는 대신 도구 이름 하나당 매처 그룹을 하나씩 따로 둔다 -
# 이러면 matcher가 단순 정확일치만 지원해도, 정규식으로 해석돼도 둘 다 안전하게 동작한다.
# (동기 request_user_input과 비동기 request_user_input_async 둘 다 Plan 모드에서 실제로
# 관측된 도구 이름이다 - agent-event-hook.sh 쪽에서 tool_name을 정규화해 한 번 더 확인한다.)
[[hooks.PreToolUse]]
matcher = "request_user_input"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$HOME/.local/share/my-dashboard/hooks/agent-event-hook.sh" codex'

[[hooks.PreToolUse]]
matcher = "request_user_input_async"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$HOME/.local/share/my-dashboard/hooks/agent-event-hook.sh" codex'

# 하트비트: 도구 호출마다 오지만 hook 쪽(agent-event-hook.sh)이 세션당 60초에 한 번만
# 실제로 전송한다(server의 stalled watchdog 입력). 이게 빠지면 PostToolUse가 서버에
# 한 번도 안 잡혀 "멈춘 듯"(stalled) 판정을 오래 못 미룬다. matcher를 일부러 생략해
# "무슨 도구든" 매번 부르게 한다 - request_user_input(동기)의 해소(UserInputResolved)
# 판별도 agent-event-hook.sh가 이 무매처 PostToolUse 안에서 tool_name을 보고 처리한다.
[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = '"$HOME/.local/share/my-dashboard/hooks/agent-event-hook.sh" codex'

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '"$HOME/.local/share/my-dashboard/hooks/agent-event-hook.sh" codex'

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = '"$HOME/.local/share/my-dashboard/hooks/agent-event-hook.sh" codex'
